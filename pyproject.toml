[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medintake"
dynamic = ["version"]
description = "Приёмка медицинских XML перед передачей в страховые по ОМС и ДМС"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
medintake = "medintake.cli:main"
medintake-api = "medintake.api:main"

[tool.setuptools.dynamic]
version = { attr = "medintake.__version__" }

[tool.setuptools.packages.find]
include = ["medintake*"]

[tool.setuptools.package-data]
medintake = ["schemas/*.xsd", "data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках и комментариях — норма для проекта
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
